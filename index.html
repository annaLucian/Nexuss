<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/public/assets/ico.png">
        <title>Nexxus | Blogs conectadas a la nube</title>
        <meta
            name="description"
            content="Consulta, sincroniza y lee tus notas al instante mediante peticiones HTTP con Fetch o Axios en Nexuss."
        />
        <link rel="stylesheet" href="/src/styles/global.css" />
    </head>
    <body class="page">
        <header class="header">
            <div class="header__brand">
                <a href="./index.html" class="header__link"> <img src="/public/assets/logo.png" class="header__logo"></img></a>
               
                <div class="header__container-isotipo">
                <p class="header__tagline">Tu hub casual.</p>
                <img src="/public/assets/isotipo.png" alt="" class="header__isotipo">
                </div>
         
            </div>
        </header>

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <div class="hero__banner">
       <img src="/public/assets/bg-web-1.png" alt="" class="hero__img" />
                <div class="hero__content">
                     <h1 id="hero-title" class="hero__title">Conecta la API, lee blogs rapidamente.</h1>
                <p class="hero__subtitle">
                    Elige tu motor favorito —<strong>Axios</strong> o <strong>Fetch</strong>—, dispara la petición y
                    pinta tus blogs en pantalla sin dar vueltas.
                </p>

                <div class="controls">
                    <label for="http-method" class="controls__label"> ¿Cómo quieres traer los datos? </label>
                    <select id="http-method" name="httpMethod" class="controls__select">
                        <option value="" disabled selected>Elige tu herramienta...</option>
                        <option value="fetch">Usar Fetch nativo</option>
                        <option value="axios">Usar Axios</option>
                    </select>
                    <p id="http-error" class="visible"></p>

                    <button id="btn-fetch" type="button" class="controls__button">Ver blogs</button>
                </div>
                </div>
                </div>
         
               
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">Hecho por &bull; @Nexuss</p>
        </footer>
        <script type="importmap">
        {
            "imports": {
            "axios": "./node_modules/axios/dist/esm/axios.js"
            }
        }
        </script>
        <script type="module" src="/dist/ts/pages/home.js"></script>
    </body>
</html>
